[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curie-cli"
version = "0.1.0"
description = "CLI for the Curie scientific AI platform"
license = { text = "MIT" }
requires-python = ">=3.10"
readme = "README.md"
repository = "https://github.com/curieapi/curie-cli"
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.0.0"
]

[project.scripts]
curie = "curie.cli:app"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]